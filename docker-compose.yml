# Start everything:        ./scripts/deploy.sh v1        (builds, starts, checks health, can roll back)
# Or the plain way:        docker compose up -d --build
# Run the tests:           docker compose --profile test run --rm test
name: busbook

services:
  # ------------------------------------------------------------------ database
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts and rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports:" on purpose: the database is reachable only by other containers.
    networks: [backend]

  # ------------------------------------------------------------------ the API
  app:
    build:
      context: .
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        FAULT_READY_FAIL: ${BAKE_FAULT:-false}
    image: ${APP_IMAGE:-bus-booking-app:dev}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_VERSION: ${APP_VERSION:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "127.0.0.1:8000:8000"             # direct access from this computer only (for checks)
    read_only: true                       # the container's files cannot be modified
    tmpfs: [/tmp]                         # ...except a temporary scratch folder in memory
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [backend]

  # ------------------------------------------------------------------ the front door (HTTPS)
  proxy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      UPSTREAM: app:8000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                  # keeps the HTTPS certificates between restarts
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  # ------------------------------------------------------------------ monitoring
  prometheus:
    image: prom/prometheus:v3.0.0
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"             # only this computer; use an SSH tunnel on a server
    networks: [backend]

  grafana:
    image: grafana/grafana:11.3.0
    restart: always
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bus-api.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"             # only this computer; use an SSH tunnel on a server
    networks: [backend]

  # ------------------------------------------------------------------ test profile
  db-test:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: bus_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d bus_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [backend]

  test:
    profiles: [test]
    build:
      context: .
      target: test
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://test:test@db-test:5432/bus_test
    networks: [backend]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  prom_data:
  grafana_data:

networks:
  backend:
